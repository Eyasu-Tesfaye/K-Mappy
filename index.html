<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>K-Mappy | Boolean Equation Solver</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="k-logo.png" sizes="32x32" />
  </head>

  <body>
    <div class="big-container">
      <div class="container">
        <h1>K-Mappy</h1>

        <!-- Tabs -->
        <div class="tabs">
          <button class="tab active" data-tab="kmap">K-map</button>
          <button class="tab" data-tab="truth">Truth Table</button>
          <button class="tab" data-tab="expression">Expression</button>
          <button class="tab" data-tab="circuit">Circuit</button>
        </div>

        <!-- Variable selection -->
        <div class="variable-selector">
          <label>Variables:</label>
          <div class="custom-dropdown" id="numVarsDropdown">
            <div class="selected">3 Variables ▼</div>
            <div class="options">
              <div data-value="2">2 Variables</div>
              <div data-value="3">3 Variables</div>
              <div data-value="4">4 Variables</div>
            </div>
          </div>
          <input type="hidden" id="numVars" value="3" />
          <button id="generateBtn">Generate</button>
        </div>

        <!-- Input -->
        <div class="input-section">
          <input type="text" id="minterms" placeholder="Enter SOP/POS/D" />
          <button id="solveBtn">Solve</button>
        </div>

        <!-- Views -->
        <div id="kmapView">
          <div id="kmap" class="kmap-container"></div>
        </div>

        <div id="truthView" class="hidden">
          <h2>Truth Table</h2>
        </div>

        <div id="expressionView" class="hidden">
          <h2>Expression</h2>
        </div>

        <div id="circuitView" class="hidden">
          <h2>Circuit</h2>
          <p>Coming soon</p>
        </div>

        <!-- Result -->
        <div class="result">
          <h2>Result:</h2>
          <p id="output">F = ?</p>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
